<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/products/honey.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VanRozgar Marketplace - Forest Resources &amp; Commons Trade</title>
    <meta name="description" content="Amazon-style Community Forest Resource (CFR) marketplace and centre-focused botanical catalogue showcasing tribal forest produce from Nashik Gram Sabhas." />
    <meta property="og:title" content="VanRozgar Marketplace - Forest Resources &amp; Commons Trade" />
    <meta property="og:description" content="Amazon-style Community Forest Resource (CFR) marketplace and centre-focused botanical catalogue showcasing tribal forest produce from Nashik Gram Sabhas." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('vanrozgar_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F2E8] dark:bg-[#1C2619] text-[#3F4A36] dark:text-[#E9EFDC] antialiased selection:bg-[#DDE8C6] selection:text-[#2F4A2A] dark:selection:bg-[#3A5233] dark:selection:text-[#DDE8C6]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
